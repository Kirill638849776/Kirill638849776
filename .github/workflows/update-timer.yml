name: Update Countdown Timer

on:
  schedule:
    - cron: "0 0 * * *"      # Запускается каждый день в 00:00 UTC
  workflow_dispatch:         # Можно запустить вручную (кнопкой)

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Calculate days until September 10
        run: |
          TARGET="2026-09-10"
          TODAY=$(date +%Y-%m-%d)
          DAYS=$(( ( $(date -d "$TARGET" +%s) - $(date -d "$TODAY" +%s) ) / 86400 ))
          if [ $DAYS -lt 0 ]; then DAYS=0; fi
          echo "DAYS=$DAYS" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/Осталось_дней-[0-9]\+/Осталось_дней-${{ env.DAYS }}/g" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes" || git commit -am "🔄 Обновлён счётчик дней до 10 сентября" && git push
